```bash
# ==========================================
# Automated Backup System Configuration
# ==========================================

# Directory containing data to be backed up
SOURCE_DIR="$HOME/automated-backup-system/test-data"

# Directory where backup archives are stored
BACKUP_DIR="$HOME/automated-backup-system/backups/archives"

# Log file location
LOG_FILE="$HOME/automated-backup-system/logs/backup.log"

# Number of days backups should be retained
RETENTION_DAYS=7

# Minimum required free disk space in KB
MINIMUM_FREE_SPACE=102400
```
